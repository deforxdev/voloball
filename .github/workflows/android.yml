name: Android LAN APK
on:
  workflow_dispatch:
  push:
    branches: [ios]
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: voloball-android-test-signing-v1
      - name: Install Android build tools
        run: sdkmanager 'platform-tools' 'build-tools;36.0.0' 'platforms;android-36'
      - name: Install Godot and templates
        shell: bash
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable
          curl -fL --retry 3 "$base/Godot_v4.7.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          curl -fL --retry 3 "$base/Godot_v4.7.1-stable_export_templates.tpz" -o /tmp/templates.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          target = Path.home() / '.local/share/godot/export_templates/4.7.1.stable'
          target.mkdir(parents=True, exist_ok=True)
          with ZipFile('/tmp/templates.zip') as archive:
              for name in ('android_debug.apk', 'android_release.apk', 'version.txt'):
                  (target / name).write_bytes(archive.read('templates/' + name))
          PY
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n'
          for key, value in {'export/android/android_sdk_path': os.environ['ANDROID_HOME'], 'export/android/java_sdk_path': os.environ['JAVA_HOME'], 'export/android/debug_keystore': str(Path.home()/'.android/debug.keystore')}.items():
              text += f'{key}="{value}"\n'
          (Path.home()/'.config/godot/editor_settings-4.7.tres').write_text(text)
          PY
      - name: Restore resources and export APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          python3 tools/prepare_mobile_assets.py .
          godot=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          "$godot" --headless --path . --editor --import 2>&1 | tee build/import.log
          "$godot" --headless --path . --scene res://test_mobile_controls.tscn --quit-after 180 -- --mobile-preview 2>&1 | tee build/touch-tests.log
          grep -q 'MOBILE REGRESSION COMPLETE: failures=0' build/touch-tests.log
          VOLOBALL_BOOT_SMOKE=1 "$godot" --headless --path . --quit-after 360 -- --mobile-preview --drive-role boot_ci 2>&1 | tee build/menu-tests.log
          grep -q 'MOBILE BOOT SMOKE PASSED' build/menu-tests.log
          VOLOBALL_BOOT_SMOKE=match "$godot" --headless --rendering-method gl_compatibility --path . --quit-after 1000 -- --mobile-preview --drive-role match_ci 2>&1 | tee build/match-tests.log
          grep -q 'MOBILE MATCH SMOKE PASSED' build/match-tests.log
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android
          "$godot" --headless --path . --export-release Android build/VOLOBALL-Android.apk 2>&1 | tee build/export.log
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/VOLOBALL-Android.apk
          unzip -t build/VOLOBALL-Android.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: VOLOBALL-Android
          path: build/VOLOBALL-Android.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-logs
          path: build/*.log
          retention-days: 7
