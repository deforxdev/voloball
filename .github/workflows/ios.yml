name: iPhone IPA for SideStore
on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner pool
        type: choice
        default: macos-26
        options: [macos-15-intel, macos-26, macos-15]
      test_simulator:
        description: Run optional iOS simulator startup checks
        type: boolean
        default: false
  push:
    branches: [mobile]
permissions:
  contents: write
concurrency:
  group: ios-${{ github.ref }}-${{ inputs.runner || 'macos-26' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7.1
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.6 for Godot 4.7 templates
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/godot-ci
            ~/Library/Application Support/Godot/export_templates/4.7.1.stable
          key: godot-4.7.1-ios-v1
      - name: Install official Godot and iOS templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot-ci"
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip" -o /tmp/godot.zip
          ditto -x -k /tmp/godot.zip "$HOME/godot-ci"
          curl --fail --location --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o /tmp/templates.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          target = Path.home() / 'Library/Application Support/Godot/export_templates/4.7.1.stable'
          target.mkdir(parents=True, exist_ok=True)
          with ZipFile('/tmp/templates.zip') as archive:
              for name in ('ios.zip', 'version.txt'):
                  (target / name).write_bytes(archive.read('templates/' + name))
          PY
      - name: Save installed Godot tools
        if: steps.godot-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/godot-ci
            ~/Library/Application Support/Godot/export_templates/4.7.1.stable
          key: godot-4.7.1-ios-v1
      - name: Restore portable assets
        run: |
          python3 tools/prepare_mobile_assets.py .
          python3 tools/check_mobile_profile.py
      - name: Import for mobile and export Xcode project
        shell: bash
        run: |
          set -euo pipefail
          godot="$HOME/godot-ci/Godot.app/Contents/MacOS/Godot"
          mkdir -p build/ios
          "$godot" --headless --path . --editor --import 2>&1 | tee build/import.log
          "$godot" --headless --path . --scene res://test_ball_controls.tscn --quit-after 360 2>&1 | tee build/ball-tests.log
          grep -q 'BALL REGRESSION COMPLETE: failures=0' build/ball-tests.log
          "$godot" --headless --path . --scene res://test_mobile_controls.tscn --quit-after 180 -- --mobile-preview 2>&1 | tee build/touch-tests.log
          grep -q 'MOBILE REGRESSION COMPLETE: failures=0' build/touch-tests.log
          "$godot" --headless --path . --scene res://test_touch_layout.tscn --quit-after 600 -- --mobile-preview --drive-role touch_layout_ci 2>&1 | tee build/touch-layout-tests.log
          grep -q 'TOUCH LAYOUT REGRESSION COMPLETE: failures=0' build/touch-layout-tests.log
          VOLOBALL_BOOT_SMOKE_QUIT=1 VOLOBALL_BOOT_SMOKE=1 "$godot" --headless --path . --quit-after 1200 -- --mobile-preview --drive-role boot_ci 2>&1 | tee build/menu-tests.log
          grep -q 'MOBILE BOOT SMOKE PASSED' build/menu-tests.log
          VOLOBALL_BOOT_SMOKE_QUIT=1 VOLOBALL_BOOT_SMOKE=match "$godot" --headless --rendering-method gl_compatibility --path . --quit-after 20000 -- --mobile-preview --drive-role match_ci 2>&1 | tee build/match-tests.log
          grep -q 'MOBILE MATCH SMOKE PASSED' build/match-tests.log
          "$godot" --headless --path . --scene res://test_photon_cancel.tscn -- --drive-role photon_cancel_ci 2>&1 | tee build/cloud-cancel.log
          grep -q 'PHOTON CANCEL PASS' build/cloud-cancel.log
          python3 tools/test_photon_online.py --godot "$godot" --output build/cloud-tests
          python3 tools/test_photon_online.py --godot "$godot" --quick --output build/quick-tests
          "$godot" --headless --path . --script res://test_photon_capacity.gd -- --drive-role photon_capacity_ci 2>&1 | tee build/cloud-capacity.log
          grep -q 'PHOTON CAPACITY PASS' build/cloud-capacity.log
          "$godot" --headless --path . --export-release iOS build/ios/voloball.ipa 2>&1 | tee build/export.log
          test -d build/ios/voloball.xcodeproj
      - name: Build iPhone app without Apple signing credentials
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project build/ios/voloball.xcodeproj -scheme voloball \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' build 2>&1 | tee build/xcodebuild.log
      - name: Package and validate SideStore IPA
        shell: bash
        run: |
          set -euo pipefail
          app="build/DerivedData/Build/Products/Release-iphoneos/voloball.app"
          test -d "$app"
          mkdir -p build/package/Payload
          cp -R "$app" build/package/Payload/
          python3 - <<'PY'
          import plistlib, pathlib, subprocess
          app = pathlib.Path('build/package/Payload/voloball.app')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          assert info['CFBundleIdentifier'] == 'com.deforxdev.voloball'
          binary = app / info['CFBundleExecutable']
          assert binary.is_file()
          archs = subprocess.check_output(['lipo', '-archs', str(binary)], text=True)
          assert 'arm64' in archs
          assert list(app.rglob('*.pck')), 'Game data is missing'
          print('Validated iPhone arm64 app:', info['CFBundleIdentifier'])
          PY
          (cd build/package && zip -qry ../VOLOBALL-iPhone-SideStore.ipa Payload)
          unzip -t build/VOLOBALL-iPhone-SideStore.ipa
      - name: Test startup from the packaged iPhone game data
        shell: bash
        run: |
          set -euo pipefail
          godot="$HOME/godot-ci/Godot.app/Contents/MacOS/Godot"
          pck="$(find build/package/Payload -name '*.pck' -type f -print -quit)"
          test -n "$pck"
          output="$PWD/build"
          unzip -p build/VOLOBALL-iPhone-SideStore.ipa "${pck#build/package/}" > "$output/packaged-ios.pck"
          isolated="$(mktemp -d)"
          cd "$isolated"
          for mode in 1 match; do
            log="$output/packaged-ios-$mode.log"
            VOLOBALL_BOOT_SMOKE_QUIT=1 VOLOBALL_BOOT_SMOKE="$mode" "$godot" --headless --main-pack "$output/packaged-ios.pck" --quit-after 2400 -- --drive-role "packaged_$mode" 2>&1 | tee "$log"
            if [ "$mode" = 1 ]; then
              grep -q 'MOBILE BOOT SMOKE PASSED' "$log"
            else
              grep -q 'MOBILE MATCH SMOKE PASSED' "$log"
            fi
            if grep -Eq "SCRIPT ERROR|Failed loading resource|No loader found|Can't load dependency|venue_fallback|loader_failed" "$log"; then
              exit 1
            fi
          done
      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: VOLOBALL-iPhone-SideStore
          path: build/VOLOBALL-iPhone-SideStore.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Publish direct IPA download
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/publish_ios_release.py build/VOLOBALL-iPhone-SideStore.ipa
      - name: Build and test iOS startup and Settings Back
        if: ${{ inputs.test_simulator == true }}
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project build/ios/voloball.xcodeproj -scheme voloball \
            -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/Simulator \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=YES EXCLUDED_ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' build 2>&1 | tee build/simulator-build.log
          python3 tools/test_ios_startup.py 2>&1 | tee build/ios-startup.log
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            build/*.log
            build/ios-startup-*.png
            build/ios-startup-results.json
            build/ios-native-*
          if-no-files-found: ignore
          retention-days: 7
