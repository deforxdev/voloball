name: Fetch official Photon Godot SDK
on:
  push:
    branches: [feature/photon-online]
    paths: [.github/workflows/photon-sdk.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download official SDK
        run: |
          curl --fail --location --retry 2 --max-time 180 'https://downloads.photonengine.com/download/fusion-godot/photon-fusion-godot4.6-3.0.0-preview-684.7z' -o photon-fusion-godot.7z
          7z l photon-fusion-godot.7z
      - uses: actions/upload-artifact@v4
        with:
          name: official-photon-godot-sdk
          path: photon-fusion-godot.7z
          retention-days: 3
