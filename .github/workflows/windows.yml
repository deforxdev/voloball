name: Windows desktop build
on:
  workflow_dispatch:
  push:
    branches: [windows-desktop]
permissions:
  contents: read
concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot and Windows release template
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable
          curl -fL --retry 3 "$base/Godot_v4.7.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot*
          curl -fL --retry 3 "$base/Godot_v4.7.1-stable_export_templates.tpz" -o /tmp/templates.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          target = Path.home() / '.local/share/godot/export_templates/4.7.1.stable'
          target.mkdir(parents=True, exist_ok=True)
          with ZipFile('/tmp/templates.zip') as archive:
              for name in ('windows_release_x86_64.exe', 'version.txt'):
                  (target / name).write_bytes(archive.read('templates/' + name))
          PY
      - name: Restore resources and export Windows executable
        run: |
          set -euo pipefail
          mkdir -p build
          python3 tools/prepare_mobile_assets.py .
          godot=/tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          "$godot" --headless --path . --editor --import > build/import.log 2>&1
          "$godot" --headless --path . --scene res://test_ball_controls.tscn --quit-after 360 > build/ball-tests.log 2>&1
          grep -q 'BALL REGRESSION COMPLETE: failures=0' build/ball-tests.log
          "$godot" --headless --path . --export-release 'Windows' build/VOLOBALL-Windows.exe > build/export.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import struct, hashlib
          path=Path('build/VOLOBALL-Windows.exe')
          data=path.read_bytes()
          assert data[:2] == b'MZ'
          pe=struct.unpack_from('<I',data,0x3c)[0]
          assert data[pe:pe+4] == b'PE\0\0'
          assert struct.unpack_from('<H',data,pe+4)[0] == 0x8664
          assert b'GDPC' in data, 'Embedded game pack is missing'
          assert b'game/ui/menu.tscn' in data
          with ZipFile('build/VOLOBALL-Windows-0.1.5.zip','w',ZIP_DEFLATED,compresslevel=6) as archive:
              archive.write(path,path.name)
              archive.write('WINDOWS.txt','WINDOWS.txt')
          print('Windows x64 EXE validated:',len(data),'bytes',hashlib.sha256(data).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: VOLOBALL-Windows
          path: build/VOLOBALL-Windows-0.1.5.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-build-logs
          path: build/*.log
          retention-days: 7
